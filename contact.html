    </p>

                        <input type="tel" id="w-phone" placeholder="Your Phone +263...">
                        <textarea id="w-message" placeholder="Tell us about your project" required></textarea>
                        <button type="submit" class="btn-primary">Send on WhatsApp</button>
                    </form>
    </section>
<section class="contact-cards">
   
  
  <a href="tel:+263789795789" class="contact-card">

    </div>
   <div class="contact-divider"></div>
     <div class="info">
       <h3>PHONE</h3>
        <p>+263 789 795 789</p>
     </div>

 </a>
